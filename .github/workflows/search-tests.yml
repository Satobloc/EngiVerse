name: EngiVerse Search Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/engiverse_search.py"
      - "tools/engiverse_extract.py"
      - "tests/**"
      - "TOOLS/EXTRACT/**"
      - ".github/workflows/search-tests.yml"
  pull_request:
    paths:
      - "tools/engiverse_search.py"
      - "tests/**"
      - ".github/workflows/search-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
